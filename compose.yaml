services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nuxt-notes-app
    ports:
      - "3000:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "3000"
      NODE_ENV: production
    restart: unless-stopped
